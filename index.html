<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architectural Interface</title>
    <style>
      @property --gradient-angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      :root {
        --bg-primary: #0a0a0c;
        --surface-elevated: rgba(255, 255, 255, 0.03);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --accent-primary: #00f0ff;
        --text-primary: #f0f0f5;
        --text-secondary: #8a8a9b;
        --easing-premium: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        overflow-x: hidden;
      }

      .viewport {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        perspective: 1000px;
      }

      .card {
        width: 100%;
        max-width: 600px;
        background: var(--surface-elevated);
        border: 1px solid var(--border-subtle);
        border-radius: 24px;
        padding: 3rem;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        opacity: 0;
        transform: translateY(40px) rotateX(10deg);
        transition:
          opacity 0.8s var(--easing-premium),
          transform 0.8s var(--easing-premium);
        will-change: transform, opacity;
      }

      .card.is-visible {
        opacity: 1;
        transform: translateY(0) rotateX(0deg);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 24px;
        padding: 1px;
        background: conic-gradient(
          from var(--gradient-angle),
          var(--accent-primary),
          transparent 40%,
          transparent 60%,
          var(--accent-primary)
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: rotate-border 4s linear infinite;
        pointer-events: none;
      }

      @keyframes rotate-border {
        to {
          --gradient-angle: 360deg;
        }
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 300;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
        background: linear-gradient(
          135deg,
          var(--text-primary),
          var(--text-secondary)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        color: var(--text-secondary);
        margin-bottom: 2rem;
      }

      .action-btn {
        background: transparent;
        color: var(--accent-primary);
        border: 1px solid var(--accent-primary);
        padding: 1rem 2rem;
        border-radius: 12px;
        font-size: 0.9rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s var(--easing-premium);
        position: relative;
        overflow: hidden;
      }

      .action-btn:hover {
        background: var(--accent-primary);
        color: var(--bg-primary);
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      }

      .status-log {
        margin-top: 2rem;
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.8rem;
        color: var(--text-secondary);
        border-top: 1px solid var(--border-subtle);
        padding-top: 1rem;
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <div class="viewport">
      <main class="card" id="primary-card">
        <h1>System Operational</h1>
        <p>
          High-fidelity rendering pipeline initialized. Type-safe data contracts
          established across polyglot backend infrastructure.
        </p>
        <button class="action-btn" id="execute-payload">
          Execute Validation
        </button>
        <div class="status-log" id="status-log">Awaiting input...</div>
      </main>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const card = document.getElementById("primary-card");
        const btn = document.getElementById("execute-payload");
        const log = document.getElementById("status-log");

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 }
        );

        observer.observe(card);

        btn.addEventListener("click", async () => {
          log.textContent = "Initiating handshake...";
          btn.disabled = true;

          try {
            const response = await fetch("/api/v1/validate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ payload: "verification_token" })
            });

            const data = await response.json();

            if (data.status === "success") {
              log.textContent = `Validation confirmed: ${data.data.message}`;
              log.style.color = "var(--accent-primary)";
            } else {
              log.textContent = `Error ${data.errorCode}: ${data.message}`;
              log.style.color = "#ff3366";
            }
          } catch (error) {
            log.textContent = "Network anomaly detected.";
            log.style.color = "#ff3366";
          } finally {
            btn.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
